<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Summary</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <!-- Flexbox Section -->
      <section class="flex-section">
        <div class="section-heading">
          <h2>Flexbox Layout</h2>
          <p>Practice arranging elements horizontally using Flexbox.</p>
        </div>

        <div class="flex-container">
          <div>Box 1</div>
          <div>Box 2</div>
          <div>Box 3</div>
        </div>
      </section>

      <!-- Grid Section -->
      <section class="grid-section">
        <div class="section-heading">
          <h2>Grid Layout</h2>
          <p>Practice creating a responsive layout using CSS Grid.</p>
        </div>

        <div class="grid-container">
          <div>Box 1</div>
          <div>Box 2</div>
          <div>Box 3</div>
          <div>Box 4</div>
          <div>Box 5</div>
          <div>Box 6</div>
        </div>
      </section>

      <!-- Circle Section -->
      <section class="circle-section">
        <div class="section-heading">
          <h2>Center Alignment</h2>
          <p>Practice centering an element horizontally and vertically.</p>
        </div>

        <div class="circle-container">
          <div>Circle</div>
        </div>
      </section>
    </main>
  </body>
</html>
